# 115nas — 115 生活客户端 Docker 版
services:
  115nas:
    # 默认直接用发布版镜像（ghcr.io）。latest 由 CI 自动维护：
    # 每天检查 115 官方 Linux 客户端版本，有新版本就重建并更新 latest，
    # 所以 docker compose pull && docker compose up -d 即可跟随官方更新。
    # - 想锁定版本：把 :latest 改成具体 tag（如 :1.1.0，对应 115Life 37.3.1）
    # - 想本地构建：取消下面 build: . 的注释，并把 image 改回 115nas-docker:1.1.0
    #build: .   #本地构建镜像
    image: ghcr.io/xheia/115nas-docker:latest
    container_name: 115nas
    restart: unless-stopped
    shm_size: 1g
    ports:
      - "6080:6080"     # noVNC 页面 + WebSocket（HTTP）
      - "6081:6081"     # HTTPS（仅挂载证书时监听）
      # - "5900:5900"   # 只有用「原生 VNC 客户端直连」或「Cloudflare 浏览器渲染 VNC」
      #                 # 时才需要：同时要开 VNC_BIND=0.0.0.0 + VNC_PASSWORD，否则容器拒启
    volumes:
      - ./data/config:/config       # 客户端配置与登录态（勿删）
      - ./data/appdata:/appdata     # WebKit Cookie = 扫码登录态（勿删）
      - ./data/cache:/cache         # 视频缓存
      - ./logs:/logs
      - ${NAS_SHARE:-./data/nas}:/media/nas     #上传目录
      - ${NAS_SHARE:-./data/nas}:/root/Downloads   # 客户端默认下载目录
    environment:
      - TZ=Asia/Shanghai
      # - VNC_PASSWORD=yourpassword   # 暴露到公网时务必设置
      # - VNC_BIND=0.0.0.0            # 仅原生 VNC 客户端/CF 浏览器渲染 VNC 需要；必须同时设密码
      # - SCREEN_WIDTH=1600           # 虚拟屏分辨率（浏览器端自动缩放）
      # - SCREEN_HEIGHT=900
      # --- 文件选择器（上传/选择下载目录时弹的那个窗口）可见路径 ---
      # - HIDE_SYSTEM_PATHS=0         # 关掉路径收敛，恢复显示容器所有目录
      # - GTK_BOOKMARKS=/root/Downloads=115 下载目录|/media/nas=NAS 共享目录
      #                               # 钉在侧栏顶部的书签，| 分隔，路径=显示名
      # - EXTRA_VISIBLE_MOUNTS=/share/Download   # 额外允许显示的挂载点，空格分隔
