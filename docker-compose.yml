# 115nas — 115 生活客户端 Docker 版
services:
  115nas:
    image: ghcr.io/xheia/115nas-docker:latest
    container_name: 115nas
    hostname: 115nas
    restart: unless-stopped
    # 停止容器时给客户端留出退出的时间。Docker 默认只给 10 秒，而退出流程最坏要
    # 1s（掐掉重启循环）+ LIFE_STOP_TIMEOUT（默认 8s，等客户端把传输队列写回
    # 本地库）≈ 9s，只剩 1 秒余量；NAS 磁盘正忙时就会踩线，被 SIGKILL 后重启会看到
    # 已完成的任务又冒出来。所以这里留一倍余量。
    # 约束：STOP_GRACE 要带单位（如 30s），且 >= LIFE_STOP_TIMEOUT + 2。
    stop_grace_period: 20s
    shm_size: 1g
    ports:
      - "6080:6080"     # Web 页面 + WebSocket（同一端口）
    volumes:
      - ./data/config:/config       # 客户端配置与登录态（勿删）
      - ./data/appdata:/appdata     # WebKit Cookie = 扫码登录态（勿删）
      - ./data/cache:/cache         # 视频缓存
      - ./logs:/logs
      - ./data/nas:/media/nas         # 上传目录
      - ./nas/Downloads:/root/Downloads    # 客户端默认下载目录
    environment:
      - TZ=Asia/Shanghai
      # - LIFE_STOP_TIMEOUT=15        # 传输任务多时加长；同时要把 STOP_GRACE 调得更大
      # - VNC_PASSWORD=yourpassword   # 设了之后浏览器里会出现登录框
      # - VNC_USER=vncuser            # 登录用户名，与上面的口令配对（默认 vncuser）
      # - VNC_FRAME_RATE=25           # 帧率上限，0 = 不限（服务端默认 60，太浪费）
      # - VNC_QUALITY_MIN=3           # 动态画质下限（快速滚动时的流畅度）
      # - VNC_QUALITY_MAX=7           # 动态画质上限（静态画面清晰度）
      # - VNC_WEBP_TIME=5             # WebP 编码耗时预算，越大越清晰越费 CPU
      # - SCREEN_WIDTH=1600           # 虚拟屏分辨率（浏览器端自适应缩放）
      # - SCREEN_HEIGHT=900
      # - UMASK=000
      # - DISPLAY_MODE=fallback       # 强制走 Xvfb+x11vnc（怀疑 KasmVNC 冲突时）
      # --- 文件选择器（上传/选择下载目录时弹的窗口）侧栏书签 ---
      # - HIDE_SYSTEM_PATHS=0         # 不钉书签
      # - GTK_BOOKMARKS=/root/Downloads=115 下载目录|/media/nas=NAS 共享目录
