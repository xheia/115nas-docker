# 115nas — 115 生活客户端 Docker 版
services:
  115nas:
    # 默认用发布版镜像（ghcr.io）。想锁定版本就把 :latest 换成具体 tag
    # （如 :1.1.2，对应 115Life 37.3.1）；想本地构建就取消 build: . 的注释。
    image: ghcr.io/xheia/115nas-docker:latest
    container_name: 115nas
    hostname: 115nas
    restart: unless-stopped
    # 停止容器时给客户端留出退出的时间（默认只给 10 秒）。它要把上传/下载任务
    # 状态写回本地库，来不及写就会被 SIGKILL，重启后上传列表里已完成的任务会
    # 重新冒出来。
    stop_grace_period: 20s
    shm_size: 1g
    ports:
      - "6080:6080"     # noVNC 页面 + WebSocket（HTTP）
      - "6081:6081"     # HTTPS（仅挂载证书时监听）
      # - "5900:5900"   # 只有用「原生 VNC 客户端直连」才需要：同时要开
      #                 # VNC_BIND=0.0.0.0 + VNC_PASSWORD，否则容器拒启
    volumes:
      - ./data/config:/config       # 客户端配置与登录态（勿删）
      - ./data/appdata:/appdata     # WebKit Cookie = 扫码登录态（勿删）
      - ./data/cache:/cache         # 视频缓存
      - ./logs:/logs
      - ${NAS_SHARE:-./data/nas}:/media/nas     #上传目录
      - ${NAS_SHARE:-./data/nas}:/root/Downloads   # 客户端默认下载目录
    environment:
      - TZ=Asia/Shanghai
      # - VNC_PASSWORD=yourpassword   # 暴露到公网时务必设置
      # - VNC_BIND=0.0.0.0            # 仅原生 VNC 客户端直连需要；必须同时设密码
      # --- 性能（默认值已调过，一般不用动）---
      # - VNC_FRAME_RATE=25           # 帧率上限，0 = 不限（默认 25；Xtigervnc 原生默认 60）
      # - NOVNC_QUALITY=5             # JPEG 画质 0-9（默认 5）
      # - NOVNC_COMPRESSION=1         # 压缩级别 0-9（默认 1，level 1 最省 CPU）
      # - SCREEN_WIDTH=1600           # 虚拟屏分辨率（浏览器端自动缩放）
      # - SCREEN_HEIGHT=900
      # --- 文件选择器（上传/选择下载目录时弹的那个窗口）侧栏书签 ---
      # - HIDE_SYSTEM_PATHS=0         # 不钉书签（容器目录本来就能浏览，这只是快捷入口）
      # - GTK_BOOKMARKS=/root/Downloads=115 下载目录|/media/nas=NAS 共享目录
      #                               # 钉在侧栏顶部的书签，| 分隔，路径=显示名
