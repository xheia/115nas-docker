name: Publish Docker image

# 触发方式：
#   1) 打版本标签推送：git tag v1.1.0 && git push origin v1.1.0
#   2. GitHub 仓库页面手动：Actions → Publish Docker image → Run workflow
#
# 产物（均为 linux/amd64——官方 deb 只有 amd64，无法构建 ARM 镜像）：
#   ghcr.io/xheia/115nas-docker:<version|latest|edge>
#   <DOCKERHUB_USERNAME>/115nas-docker:<version|latest>（配置了 Docker Hub 密钥才推）
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub → Account Settings → Personal access tokens
#                       （权限 Read/Write/Delete，不是登录密码）
# ghcr.io 无需额外密钥：自动用 GITHUB_TOKEN。
#   GHCR_PAT（可选）        带 write:packages 权限的 PAT，用于自动把 ghcr 包设为
#                           public；不配则首次发布后需手动改 Package settings。
#
# 注意：secrets 上下文不能出现在 steps.if 里（GitHub 限制），
# 故先注入 job 级 env.DH_USER/DH_TOKEN，再用 env 上下文做条件判断。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: 115nas-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # ---- ghcr.io（自动使用 GITHUB_TOKEN）----
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Docker Hub（未配置密钥则整步跳过，只发布 ghcr）----
      - name: Log in to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 计算镜像标签 ----
      # 标签推送 v1.2.3 → 1.2.3 + latest；其他触发 → edge
      - name: Compute image tags
        id: tags
        run: |
          REF="${{ github.ref_name }}"
          VER="${REF#v}"
          GHCR="ghcr.io/${{ github.repository_owner }}/115nas-docker"
          TAGS="${GHCR}:${VER}"
          if [ "${REF#v}" != "$REF" ]; then
            TAGS="${TAGS},${GHCR}:latest"
          else
            TAGS="${TAGS},${GHCR}:edge"
          fi
          if [ -n "$DH_USER" ]; then
            TAGS="${TAGS},${DH_USER}/115nas-docker:${VER}"
            if [ "${REF#v}" != "$REF" ]; then
              TAGS="${TAGS},${DH_USER}/115nas-docker:latest"
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "将推送: $TAGS"

      # ---- 构建并推送（amd64）----
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- ghcr 包默认 private，尝试改成 public（失败不阻断）----
      # 根因（2026-10-18 实测）：GITHUB_TOKEN 是 installation token，PATCH
      # /user/packages/... 对它返回 404 Not Found——它无法管理用户级包。
      # 两条路：① 手动改一次（visibility 是持久属性，之后永久保持）；
      # ② 想要全自动：建一个带 write:packages 权限的 PAT，
      # 存为仓库 Secret GHCR_PAT，本步会优先使用它。
      - name: Make ghcr package public (best effort)
        continue-on-error: true
        env:
          CR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          if [ -n "$CR_PAT" ]; then TOKEN="$CR_PAT"; fi
          RESP=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -w "\n%{http_code}" \
            "https://api.github.com/user/packages/container/115nas-docker" \
            -d '{"visibility":"public"}')
          echo "response: $RESP"
          case "$RESP" in
            *200|*201) echo "ghcr 包已设为 public" ;;
            *) echo "自动设置公开失败——visibility 是持久属性，手动改一次即可：Package settings -> Change visibility -> Public" ;;
          esac
