name: Publish Docker image

# 触发方式：
#   1) 打版本标签推送：git tag v1.1.0 && git push origin v1.1.0
#   2. GitHub 仓库页面手动：Actions → Publish Docker image → Run workflow
#
# 产物（均为 linux/amd64——官方 deb 只有 amd64，无法构建 ARM 镜像）：
#   ghcr.io/xheia/115nas-docker:<version|latest|edge>
#   <DOCKERHUB_USERNAME>/115nas-docker:<version|latest>（配置了 Docker Hub 密钥才推）
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub → Account Settings → Personal access tokens
#                       （权限 Read/Write/Delete，不是登录密码）
# ghcr.io 无需额外密钥：自动用 GITHUB_TOKEN。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: 115nas-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ---- ghcr.io（自动使用 GITHUB_TOKEN）----
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Docker Hub（未配置密钥则整步跳过，只发布 ghcr）----
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 计算镜像标签 ----
      # 标签推送 v1.2.3 → 1.2.3 + latest；其他触发 → edge
      - name: Compute image tags
        id: tags
        run: |
          REF="${{ github.ref_name }}"
          VER="${REF#v}"
          TAGS="ghcr.io/${{ github.repository_owner }}/115nas-docker:${VER}"
          if [ "${REF#v}" != "$REF" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository_owner }}/115nas-docker:latest"
          else
            TAGS="$TAGS,ghcr.io/${{ github.repository_owner }}/115nas-docker:edge"
          fi
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/115nas-docker:${VER}"
            if [ "${REF#v}" != "$REF" ]; then
              TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/115nas-docker:latest"
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "将推送: $TAGS"

      # ---- 构建并推送（amd64）----
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- ghcr 包默认是 private，尝试改成 public（失败不阻断）----
      - name: Make ghcr package public (best effort)
        continue-on-error: true
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/115nas-docker" \
            -d '{"visibility":"public"}' \
            && echo "ghcr 包已设为 public" \
            || echo "未能自动设置公开（首次发布后也可在 Package settings 手动改）"
