name: probe-115-upstream

# 临时探测：验证 GitHub Actions 海外 runner 对 115 官方接口的可达性与下载速度。
# 探测完成后删除本文件，由 check-update.yml 接手。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe appversion API
        run: |
          curl -sS -m 30 "https://appversion.115.com/1/web/1.0/api/getMultiVer" \
            -o /tmp/mv.json -w "appversion: HTTP %{http_code} %{size_download}B %{time_total}s\n"
          python3 -c "
          import json
          d = json.load(open('/tmp/mv.json'))
          v = d['data']['115Life_Linux']
          print('linux_115life version:', v['version_code'])
          print('version_url:', v['version_url'])
          print('is_new:', v['is_new'])
          "
      - name: Probe deb download speed
        run: |
          curl -sS -m 600 -o /tmp/test.deb \
            -w "deb: HTTP %{http_code} %{size_download}B speed=%{speed_download}B/s time=%{time_total}s\n" \
            "https://down.115.com/client/115pc/lin/115Life_37.3.1.deb"
          ls -la /tmp/test.deb
          dpkg-deb --info /tmp/test.deb 2>/dev/null | head -5 || echo "dpkg-deb not available"
